name: Build & Test & SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Mycelium.Bloom/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: Mycelium.Bloom
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tailwind CSS
        working-directory: Mycelium.Bloom
        run: pnpm run css:build

      - name: Verify shared token consumption
        working-directory: Mycelium.Bloom
        run: pnpm run test:tokens

      - name: Restore dependencies
        run: dotnet restore Mycelium.Bloom.sln --configfile Nuget.Config
        
      - name: Sonarqube Begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          dotnet sonarscanner begin /k:"mycelium-cmbse_mycelium-bloom" /o:"mycelium-cmbse" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.coverageReportPaths="sonar-js-coverage.xml" /d:sonar.cpd.exclusions="**/wwwroot/css/app.css,**/wwwroot/css/tokens.css,**/Styles/Generated/MyceliumTokens/theme.css" /d:sonar.exclusions="**/wwwroot/css/app.css,**/wwwroot/css/tokens.css,**/Styles/Generated/MyceliumTokens/theme.css"

      - name: Run JavaScript Tests and Compute Coverage Reports
        working-directory: Mycelium.Bloom
        run: pnpm run test:coverage:sonar

      - name: Build
        run: dotnet build --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      - name: Run Tests and Compute Coverage
        run: dotnet-coverage collect "dotnet test Mycelium.Bloom.sln --no-restore --no-build --verbosity normal" -f xml -o "coverage.xml" 

      - name: Verify JavaScript Coverage Reports
        shell: bash
        run: |
          set -euo pipefail

          test -s lcov.info
          test -s sonar-js-coverage.xml

          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from "node:fs";
          import { isAbsolute, posix, relative, resolve, sep, win32 } from "node:path";

          const repositoryRoot = process.cwd();
          const lcov = readFileSync("lcov.info", "utf8");
          const xml = readFileSync("sonar-js-coverage.xml", "utf8");
          const requiredSources = [
              "Mycelium.Bloom/Components/UI/Atoms/SearchInput/SearchInput.razor.js",
              "Mycelium.Bloom/Components/UI/Atoms/SelectInput/SelectInput.razor.js"
          ];

          if (
              !xml.startsWith('<?xml version="1.0" encoding="UTF-8"?>\n<coverage version="1">\n')
              || !xml.endsWith("</coverage>\n")
          ) {
              throw new Error("Generic coverage XML does not have a coverage version 1 root.");
          }

          const lineRecords = [...xml.matchAll(/^    <lineToCover\b/gm)];

          if (lineRecords.length === 0) {
              throw new Error("Generic coverage XML has no lineToCover records.");
          }

          const xmlSources = [...xml.matchAll(/^  <file path="([^"]+)">$/gm)]
              .map(match => decodeXmlAttribute(match[1]));
          const lcovSources = [...lcov.matchAll(/^SF:(.+)\r?$/gm)]
              .map(match => posix.normalize(match[1].replaceAll("\\", "/")));

          if (
              xmlSources.length !== lcovSources.length
              || xmlSources.some(source => !lcovSources.includes(source))
          ) {
              throw new Error("Generic coverage XML source paths do not match LCOV.");
          }

          for (const requiredSource of requiredSources) {
              if (!xmlSources.includes(requiredSource)) {
                  throw new Error(`Generic coverage XML is missing ${requiredSource}.`);
              }
          }

          for (const sourcePath of xmlSources) {
              if (
                  sourcePath.includes("\\")
                  || isAbsolute(sourcePath)
                  || posix.isAbsolute(sourcePath)
                  || win32.isAbsolute(sourcePath)
              ) {
                  throw new Error(`Generic coverage XML contains an absolute or unnormalized path: ${sourcePath}`);
              }

              const resolvedPath = resolve(repositoryRoot, ...sourcePath.split("/"));
              const relativePath = relative(repositoryRoot, resolvedPath);

              if (
                  relativePath === ".."
                  || relativePath.startsWith(`..${sep}`)
                  || isAbsolute(relativePath)
                  || !statSync(resolvedPath).isFile()
              ) {
                  throw new Error(`Generic coverage XML source does not resolve: ${sourcePath}`);
              }
          }

          console.log(
              `Validated ${xmlSources.length} generic coverage source file(s) and ${lineRecords.length} executable line(s).`
          );

          function decodeXmlAttribute(value) {
              return value
                  .replaceAll("&quot;", '"')
                  .replaceAll("&apos;", "'")
                  .replaceAll("&lt;", "<")
                  .replaceAll("&gt;", ">")
                  .replaceAll("&amp;", "&");
          }
          NODE

      - name: Sonarqube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Build production container
        run: docker build --pull --target final --tag mycelium-bloom:security .

      - name: Scan production container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: mycelium-bloom:security
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: 'false'
