name: Build & Test & SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          overwrite-settings: false
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Mycelium.Bloom.sln
        
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Mycelium.Bloom/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: Mycelium.Bloom
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tailwind CSS
        working-directory: Mycelium.Bloom
        run: pnpm run css:build
        
      - name: Sonarqube Begin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m"
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          dotnet sonarscanner begin /k:"mycelium-cmbse_mycelium-bloom" /o:"mycelium-cmbse" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.verbose=true /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.javascript.lcov.reportPaths="lcov.info" /d:sonar.cpd.exclusions="**/wwwroot/css/app.css" /d:sonar.exclusions="**/wwwroot/css/app.css"

      - name: Run JavaScript Tests and Compute Coverage
        working-directory: Mycelium.Bloom
        run: pnpm run test:coverage

      - name: Verify JavaScript Coverage Report
        shell: bash
        run: |
          if [ ! -s lcov.info ]; then
            echo "::error::lcov.info is missing or empty"
            exit 1
          fi

          required_sources=(
            "Mycelium.Bloom/Components/Pages/DesignSystem.razor.js"
            "Mycelium.Bloom/Components/UI/Atoms/SearchInput/SearchInput.razor.js"
            "Mycelium.Bloom/Components/UI/Atoms/SelectInput/SelectInput.razor.js"
          )

          for source in "${required_sources[@]}"; do
            if ! grep -Fqx "SF:${source}" lcov.info; then
              echo "::error::lcov.info is missing SF:${source}"
              exit 1
            fi
          done

      - name: Build
        run: dotnet build --no-restore --no-incremental /p:ContinuousIntegrationBuild=true

      - name: Run Tests and Compute Coverage
        run: dotnet-coverage collect "dotnet test Mycelium.Bloom.sln --no-restore --no-build --verbosity normal" -f xml -o "coverage.xml" 

      - name: Diagnose JavaScript Coverage Import
        shell: bash
        run: |
          set -euo pipefail

          echo "Working directory: $(pwd)"
          echo "LCOV absolute path: $(realpath lcov.info)"

          test -s lcov.info

          echo "LCOV bytes: $(wc -c < lcov.info)"
          echo "LCOV source records:"
          grep '^SF:' lcov.info

          while IFS= read -r record; do
              source_path="${record#SF:}"

              if [ ! -f "$source_path" ]; then
                  echo "Unresolved LCOV source: $source_path"
                  exit 1
              fi

              echo "Resolved LCOV source: $source_path"
          done < <(grep '^SF:' lcov.info)

      - name: Sonarqube end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
